[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpt-stock-monitor"
version = "0.1.0"
description = "Monitor GPT product stock changes and deliver notifications."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "playwright>=1.50,<2",
  "httpx>=0.27,<1",
  "tzdata; platform_system == 'Windows'",
]

[project.scripts]
gpt-stock-monitor = "gpt_stock_monitor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-httpx",
  "pytest-cov",
  "ruff==0.16.0",
  "mypy",
  "build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_stock_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
