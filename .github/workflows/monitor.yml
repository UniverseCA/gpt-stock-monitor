name: Monitor stock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: printf 'Hosted dispatch is working\n'
  ecs-probe:
    runs-on: [self-hosted, stock-monitor]
    timeout-minutes: 2
    steps:
      - run: |
          whoami
          python --version
          git --version