name: Monitor stock

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without sending notifications
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gpt-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: monitor-production
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run live monitor
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: gpt-stock-monitor
        env:
          TMPDIR: ${{ runner.temp }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      - name: Run dry monitor
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: gpt-stock-monitor --dry-run
        env:
          TMPDIR: ${{ runner.temp }}
